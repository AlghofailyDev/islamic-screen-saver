<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap">
  <style>
    body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #1b1b1b; }
    a { color: #1f7a63; } a:hover { color: #155a49; }
    .arabic { font-family: "Amiri Quran", "KFGQPC Uthmanic Script HAFS", "Traditional Arabic", serif; }
    .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1100px; height: 720px; overflow: hidden; border-radius: 8px; background: linear-gradient(160deg, #f5f6f7 0%, #eff2f1 100%); border: 1px solid rgba(0, 0, 0, 0.1); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 0 0 16px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px;">
      <span style="width: 16px; height: 16px; border-radius: 4px; background: {{accent}};"></span>
      <span>Islamic Screensaver</span>
    </div>
    <div style="display: flex;">
      <span style="width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg class="ico" viewBox="0 0 16 16"><path d="M2 8h12"></path></svg></span>
      <span style="width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg class="ico" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1"></rect></svg></span>
      <span style="width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;"><svg class="ico" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"></path></svg></span>
    </div>
  </div>

  <div style="display: flex; flex: 1; min-height: 0;">
    <div style="width: 260px; flex-shrink: 0; display: flex; flex-direction: column; padding: 8px 8px 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px;">
          <svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-5 0V4A2.5 2.5 0 0 1 8 1.5z"></path><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0"></path><path d="M8 12v2.5"></path></svg><span>Reciters</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px; background: rgba(0, 0, 0, 0.045);">
          <span style="position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: {{accent}};"></span>
          <svg class="ico" viewBox="0 0 16 16"><path d="M2 3h4.5a2 2 0 0 1 1.5.7A2 2 0 0 1 9.5 3H14v10H9.5a1.5 1.5 0 0 0-1.5.8A1.5 1.5 0 0 0 6.5 13H2z"></path><path d="M8 4v10"></path></svg><span>Surahs</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px;">
          <svg class="ico" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><circle cx="5.5" cy="6.5" r="1.2"></circle><path d="M14 10.5 10.5 7 4 13"></path></svg><span>Background</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px;">
          <svg class="ico" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 0 12c1 0 1.5-.6 1.2-1.5-.4-1 .3-1.8 1.3-1.8h1.2A2.3 2.3 0 0 0 14 8.5 6 6 0 0 0 8 2z"></path><circle cx="5" cy="7" r=".8"></circle><circle cx="8" cy="5" r=".8"></circle><circle cx="11" cy="7" r=".8"></circle></svg><span>Appearance</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px;">
          <svg class="ico" viewBox="0 0 16 16"><path d="M2 4h8M6 2v2M4 4c.5 3 2.5 5.5 5 7M8 4c-.5 3-2.5 5.5-5 7"></path><path d="M9 14l2.5-6 2.5 6M10 12h3"></path></svg><span>Translation</span>
        </div>
      </div>
      <div style="flex: 1;"></div>
      <div style="position: relative; display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 12px; border-radius: 4px; font-size: 14px;">
        <svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"></circle><path d="M8 7v4M8 5v.5"></path></svg><span>About</span>
      </div>
    </div>

    <div style="flex: 1; min-width: 0; overflow: hidden; padding: 24px 40px 0; display: flex; flex-direction: column;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 28px; font-weight: 600; line-height: 36px;">Surahs</span>
        <span style="font-size: 14px; color: #5d5d5d;">Which surahs play, and in what order.</span>
      </div>

      <div style="margin-top: 20px; display: flex; align-items: center; gap: 12px;">
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; width: 240px; padding: 0 10px; border-radius: 4px; background: #ffffff; border: 1px solid #e5e5e5; border-bottom-color: #8a8a8a; font-size: 14px; color: #8a8a8a;"><svg class="ico" viewBox="0 0 16 16" style="width: 14px; height: 14px;"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>Search surahs</span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 4px; background: #fbfbfb; border: 1px solid rgba(0, 0, 0, 0.12); font-size: 14px;">Select all</span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 4px; background: #fbfbfb; border: 1px solid rgba(0, 0, 0, 0.12); font-size: 14px;">Clear</span>
        <span style="font-size: 12px; color: #5d5d5d;">{{selectedCount}} of 114 selected</span>
        <span style="flex: 1;"></span>
        <div style="display: flex; align-items: center; gap: 4px;">
          <span style="position: relative; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: 14px; font-weight: 600;">Sequential<span style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 2px; background: {{accent}};"></span></span>
          <span style="position: relative; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: 14px; color: #5d5d5d;">Shuffled</span>
        </div>
      </div>

      <div style="position: relative; flex: 1; min-height: 0; margin-top: 16px; overflow: hidden;">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{surahs}}" as="s" hint-placeholder-count="30">
            <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border-radius: 6px; background: {{s.bg}}; border: 1px solid {{s.border}};">
              <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, 0.05); font-size: 12px; color: #5d5d5d; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{s.n}}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.en}}</span><span style="font-size: 12px; color: #5d5d5d;">{{s.ayahs}} verses</span></div>
              <span class="arabic" style="font-size: 18px; line-height: 1;">{{s.ar}}</span>
              <svg class="ico" viewBox="0 0 16 16" style="width: 14px; height: 14px; stroke-width: 2; color: {{s.checkColor}}; opacity: {{s.checkOpacity}};"><path d="m3.5 8.5 3 3 6-7"></path></svg>
            </div>
          </sc-for>
        </div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(180deg, rgba(240, 242, 241, 0) 0%, rgba(240, 242, 241, 1) 100%);"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1f7a63","options":["#1f7a63","#0067c0","#8b5e2b","#5b5fc7"]},"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1f7a63';
    const r = parseInt(accent.slice(1, 3), 16), g = parseInt(accent.slice(3, 5), 16), b = parseInt(accent.slice(5, 7), 16);
    const soft = 'rgba(' + r + ',' + g + ',' + b + ',0.08)';
    const data = [
      [1,"الفاتحة","Al-Fatihah",7],[2,"البقرة","Al-Baqarah",286],[3,"آل عمران","Ali 'Imran",200],[4,"النساء","An-Nisa",176],[5,"المائدة","Al-Ma'idah",120],[6,"الأنعام","Al-An'am",165],[7,"الأعراف","Al-A'raf",206],[8,"الأنفال","Al-Anfal",75],[9,"التوبة","At-Tawbah",129],[10,"يونس","Yunus",109],
      [11,"هود","Hud",123],[12,"يوسف","Yusuf",111],[13,"الرعد","Ar-Ra'd",43],[14,"إبراهيم","Ibrahim",52],[15,"الحجر","Al-Hijr",99],[16,"النحل","An-Nahl",128],[17,"الإسراء","Al-Isra",111],[18,"الكهف","Al-Kahf",110],[19,"مريم","Maryam",98],[20,"طه","Taha",135],
      [21,"الأنبياء","Al-Anbya",112],[22,"الحج","Al-Hajj",78],[23,"المؤمنون","Al-Mu'minun",118],[24,"النور","An-Nur",64],[25,"الفرقان","Al-Furqan",77],[26,"الشعراء","Ash-Shu'ara",227],[27,"النمل","An-Naml",93],[28,"القصص","Al-Qasas",88],[29,"العنكبوت","Al-'Ankabut",69],[30,"الروم","Ar-Rum",60],
      [31,"لقمان","Luqman",34],[32,"السجدة","As-Sajdah",30],[33,"الأحزاب","Al-Ahzab",73],[34,"سبإ","Saba",54],[35,"فاطر","Fatir",45],[36,"يس","Ya-Sin",83],[37,"الصافات","As-Saffat",182],[38,"ص","Sad",88],[39,"الزمر","Az-Zumar",75],[40,"غافر","Ghafir",85],
      [41,"فصلت","Fussilat",54],[42,"الشورى","Ash-Shuraa",53],[43,"الزخرف","Az-Zukhruf",89],[44,"الدخان","Ad-Dukhan",59],[45,"الجاثية","Al-Jathiyah",37],[46,"الأحقاف","Al-Ahqaf",35],[47,"محمد","Muhammad",38],[48,"الفتح","Al-Fath",29],[49,"الحجرات","Al-Hujurat",18],[50,"ق","Qaf",45],
      [51,"الذاريات","Adh-Dhariyat",60],[52,"الطور","At-Tur",49],[53,"النجم","An-Najm",62],[54,"القمر","Al-Qamar",55],[55,"الرحمن","Ar-Rahman",78],[56,"الواقعة","Al-Waqi'ah",96],[57,"الحديد","Al-Hadid",29],[58,"المجادلة","Al-Mujadila",22],[59,"الحشر","Al-Hashr",24],[60,"الممتحنة","Al-Mumtahanah",13],
      [61,"الصف","As-Saf",14],[62,"الجمعة","Al-Jumu'ah",11],[63,"المنافقون","Al-Munafiqun",11],[64,"التغابن","At-Taghabun",18],[65,"الطلاق","At-Talaq",12],[66,"التحريم","At-Tahrim",12],[67,"الملك","Al-Mulk",30],[68,"القلم","Al-Qalam",52],[69,"الحاقة","Al-Haqqah",52],[70,"المعارج","Al-Ma'arij",44],
      [71,"نوح","Nuh",28],[72,"الجن","Al-Jinn",28],[73,"المزمل","Al-Muzzammil",20],[74,"المدثر","Al-Muddaththir",56],[75,"القيامة","Al-Qiyamah",40],[76,"الإنسان","Al-Insan",31],[77,"المرسلات","Al-Mursalat",50],[78,"النبأ","An-Naba",40],[79,"النازعات","An-Nazi'at",46],[80,"عبس","'Abasa",42],
      [81,"التكوير","At-Takwir",29],[82,"الانفطار","Al-Infitar",19],[83,"المطففين","Al-Mutaffifin",36],[84,"الانشقاق","Al-Inshiqaq",25],[85,"البروج","Al-Buruj",22],[86,"الطارق","At-Tariq",17],[87,"الأعلى","Al-A'la",19],[88,"الغاشية","Al-Ghashiyah",26],[89,"الفجر","Al-Fajr",30],[90,"البلد","Al-Balad",20],
      [91,"الشمس","Ash-Shams",15],[92,"الليل","Al-Layl",21],[93,"الضحى","Ad-Duhaa",11],[94,"الشرح","Ash-Sharh",8],[95,"التين","At-Tin",8],[96,"العلق","Al-'Alaq",19],[97,"القدر","Al-Qadr",5],[98,"البينة","Al-Bayyinah",8],[99,"الزلزلة","Az-Zalzalah",8],[100,"العاديات","Al-'Adiyat",11],
      [101,"القارعة","Al-Qari'ah",11],[102,"التكاثر","At-Takathur",8],[103,"العصر","Al-'Asr",3],[104,"الهمزة","Al-Humazah",9],[105,"الفيل","Al-Fil",5],[106,"قريش","Quraysh",4],[107,"الماعون","Al-Ma'un",7],[108,"الكوثر","Al-Kawthar",3],[109,"الكافرون","Al-Kafirun",6],[110,"النصر","An-Nasr",3],
      [111,"المسد","Al-Masad",5],[112,"الإخلاص","Al-Ikhlas",4],[113,"الفلق","Al-Falaq",5],[114,"الناس","An-Nas",6]
    ];
    const picked = new Set([1, 2, 18, 36, 55, 56, 67]);
    for (let n = 78; n <= 114; n++) picked.add(n);
    const surahs = data.map(([n, ar, en, ayahs]) => {
      const on = picked.has(n);
      return {
        n, ar, en, ayahs,
        bg: on ? soft : '#fbfbfb',
        border: on ? accent : 'rgba(0, 0, 0, 0.058)',
        checkColor: accent,
        checkOpacity: on ? 1 : 0,
      };
    });
    return { accent, surahs, selectedCount: picked.size };
  }
}
</script>
</body>
</html>
